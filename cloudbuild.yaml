substitutions:
  _REGION: asia-southeast1
  _SERVICE: gemini-reflections-journal
  _APP_URL: https://betterhuman.ai.studio
  _FIREBASE_API_KEY: ''
  _FIREBASE_PROJECT_ID: ''
  _FIREBASE_APP_ID: ''
  _FIREBASE_AUTH_DOMAIN: ''
  _FIRESTORE_DATABASE_ID: '(default)'
  _FIREBASE_STORAGE_BUCKET: ''
  _FIREBASE_MESSAGING_SENDER_ID: ''

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=gcr.io/$PROJECT_ID/${_SERVICE}:$BUILD_ID
      - --build-arg=NEXT_PUBLIC_APP_URL=${_APP_URL}
      - --build-arg=NEXT_PUBLIC_FIREBASE_API_KEY=${_FIREBASE_API_KEY}
      - --build-arg=NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID}
      - --build-arg=NEXT_PUBLIC_FIREBASE_APP_ID=${_FIREBASE_APP_ID}
      - --build-arg=NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}
      - --build-arg=NEXT_PUBLIC_FIREBASE_FIRESTORE_DATABASE_ID=${_FIRESTORE_DATABASE_ID}
      - --build-arg=NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${_FIREBASE_STORAGE_BUCKET}
      - --build-arg=NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${_FIREBASE_MESSAGING_SENDER_ID}
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/${_SERVICE}:$BUILD_ID
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=gcr.io/$PROJECT_ID/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --cpu=1
      - --memory=1Gi
      - --concurrency=40
      - --min-instances=1
      - --max-instances=10
      - --timeout=300
      - --set-env-vars=FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID},NEXT_PUBLIC_APP_URL=${_APP_URL},NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID},NEXT_PUBLIC_FIREBASE_FIRESTORE_DATABASE_ID=${_FIRESTORE_DATABASE_ID}

images:
  - gcr.io/$PROJECT_ID/${_SERVICE}:$BUILD_ID

options:
  logging: CLOUD_LOGGING_ONLY
